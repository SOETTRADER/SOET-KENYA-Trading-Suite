<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOET KENYA | Deriv Trading Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

  <!-- NAVIGATION HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center space-x-3">
      <div id="statusDot" class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-xl font-bold tracking-wider text-emerald-400">SOET KENYA <span class="text-slate-400 text-sm font-normal">| Trading Suite</span></h1>
    </div>
    
    <!-- ACCOUNT & AUTH STATUS -->
    <div id="authSection" class="flex items-center space-x-3">
      <div id="accountContainer" class="hidden flex-col items-end">
        <span id="accountEmail" class="text-xs font-semibold text-emerald-400">User</span>
        <span id="accountBalance" class="text-xs text-slate-300 font-mono">Balance: $0.00</span>
      </div>

      <button onclick="promptManualToken()" id="tokenBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs py-2 px-3 rounded-lg transition cursor-pointer">
        Enter API Token
      </button>

      <button id="logoutBtn" onclick="logout()" class="bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs py-2 px-3 rounded-lg transition hidden cursor-pointer">
        Disconnect
      </button>
    </div>
  </header>

  <!-- LIVE MARKET TICKER BANNER -->
  <div class="bg-slate-900/60 border-b border-slate-800/80 px-6 py-2.5 flex flex-wrap justify-between items-center text-xs gap-4">
    <div class="flex items-center space-x-4">
      <span class="text-slate-400 uppercase font-semibold">Active Feed:</span>
      <span id="activeMarketDisplay" class="font-bold text-slate-200">Volatility 100 Index</span>
      <span id="livePriceDisplay" class="font-mono text-sm font-bold text-emerald-400">0.0000</span>
    </div>
    <div class="flex items-center space-x-2">
      <span class="text-slate-400">Recent Digits:</span>
      <div id="recentDigitsContainer" class="flex space-x-1 font-mono font-bold"></div>
    </div>
  </div>

  <!-- MAIN HUD CONTENT -->
  <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto w-full">

    <!-- LEFT & CENTER: DIGIT STATS & VISUALIZERS -->
    <div class="lg:col-span-2 flex flex-col gap-6">
      
      <!-- DIGIT HEATMAP -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
        <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
          <div>
            <h2 class="text-lg font-semibold text-slate-200">Digit Frequency Analyzer</h2>
            <p class="text-xs text-slate-400">Live 0–9 statistical distribution</p>
          </div>

          <!-- MARKET & TICK WINDOW SELECTORS -->
          <div class="flex space-x-3">
            <select id="marketSelect" onchange="changeMarket(this.value)" class="bg-slate-950 border border-slate-700 text-xs text-slate-200 rounded-lg px-3 py-2 outline-none">
              <option value="R_100" selected>Volatility 100 Index</option>
              <option value="1HZ100V">Volatility 100 (1s) Index</option>
              <option value="R_75">Volatility 75 Index</option>
              <option value="R_50">Volatility 50 Index</option>
              <option value="R_25">Volatility 25 Index</option>
              <option value="R_10">Volatility 10 Index</option>
              <option value="1HZ200V">Volatility 200 (1s) Index</option>
              <option value="1HZ300V">Volatility 300 (1s) Index</option>
            </select>

            <select id="tickWindow" onchange="changeTickWindow(this.value)" class="bg-slate-950 border border-slate-700 text-xs text-slate-200 rounded-lg px-3 py-2 outline-none">
              <option value="25">25 Ticks</option>
              <option value="50">50 Ticks</option>
              <option value="100" selected>100 Ticks</option>
              <option value="500">500 Ticks</option>
            </select>
          </div>
        </div>

        <!-- 0-9 BARS -->
        <div id="digitGrid" class="grid grid-cols-10 gap-2 h-48 items-end border-b border-slate-800 pb-4"></div>
      </div>

      <!-- LIVE CONSOLE TERMINAL -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex-1 flex flex-col">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Live Execution Log</h3>
        <div id="consoleLog" class="bg-slate-950 rounded-lg p-3 font-mono text-xs text-emerald-400 h-48 overflow-y-auto space-y-1">
          <div>[SYSTEM] Connecting to Deriv Public Feed...</div>
        </div>
      </div>
    </div>

    <!-- RIGHT: STRATEGY & BOT CONTROLS -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col justify-between">
      <div>
        <h2 class="text-lg font-semibold text-slate-200 mb-1">Automated Trading Bot</h2>
        <p class="text-xs text-slate-400 mb-6">Execution & risk parameters</p>

        <div class="space-y-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Contract Type</label>
            <select id="strategyType" class="w-full bg-slate-950 border border-slate-700 text-sm text-slate-200 rounded-lg p-2.5 outline-none">
              <option value="DIFFERS">Digit Differs</option>
              <option value="MATCHES">Digit Matches</option>
              <option value="OVER">Digit Over</option>
              <option value="UNDER">Digit Under</option>
              <option value="EVEN">Digit Even</option>
              <option value="ODD">Digit Odd</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Target / Barrier Digit</label>
              <input type="number" id="targetDigit" value="7" min="0" max="9" class="w-full bg-slate-950 border border-slate-700 text-sm text-slate-200 rounded-lg p-2.5 outline-none">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Trigger Pct (%)</label>
              <input type="number" id="triggerThreshold" value="14" min="5" max="50" class="w-full bg-slate-950 border border-slate-700 text-sm text-slate-200 rounded-lg p-2.5 outline-none">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Initial Stake ($)</label>
              <input type="number" id="stakeAmount" value="1.0" step="0.5" class="w-full bg-slate-950 border border-slate-700 text-sm text-slate-200 rounded-lg p-2.5 outline-none">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Martingale Multiplier</label>
              <input type="number" id="martingaleMult" value="1.5" step="0.1" class="w-full bg-slate-950 border border-slate-700 text-sm text-slate-200 rounded-lg p-2.5 outline-none">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Take Profit ($)</label>
              <input type="number" id="takeProfit" value="10.0" class="w-full bg-slate-950 border border-slate-700 text-sm text-slate-200 rounded-lg p-2.5 outline-none">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Stop Loss ($)</label>
              <input type="number" id="stopLoss" value="20.0" class="w-full bg-slate-950 border border-slate-700 text-sm text-slate-200 rounded-lg p-2.5 outline-none">
            </div>
          </div>
        </div>
      </div>

      <div class="mt-6 pt-6 border-t border-slate-800">
        <button id="toggleBotBtn" onclick="toggleBot()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition cursor-pointer">
          Start Auto Bot
        </button>
      </div>
    </div>

  </main>

  <!-- JAVASCRIPT ENGINE -->
  <script>
    const APP_ID = "348Mnoh1ko1D10tYBCueg";
    let ws = null;
    let token = null;
    let currentMarket = "R_100";
    let digitHistory = [];
    let tickWindow = 100;
    let botActive = false;
    let tradeInProgress = false;
    let currentStake = 1.0;

    function log(msg) {
      const consoleEl = document.getElementById('consoleLog');
      const time = new Date().toLocaleTimeString();
      consoleEl.innerHTML = `<div><span class="text-slate-500">[${time}]</span> ${msg}</div>` + consoleEl.innerHTML;
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderDigitGrid();
      
      const urlParams = new URLSearchParams(window.location.search);
      const urlToken = urlParams.get('token1');
      if (urlToken) {
        token = urlToken;
        localStorage.setItem('deriv_token', token);
        window.history.replaceState({}, document.title, window.location.pathname);
      } else {
        token = localStorage.getItem('deriv_token');
      }

      initWebSocket();
    });

    function initWebSocket() {
      ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

      ws.onopen = function() {
        log("Public WebSocket stream connected.");
        subscribeToMarket(currentMarket);

        if (token) {
          log("Authenticating API Token...");
          ws.send(JSON.stringify({ authorize: token }));
        }
      };

      ws.onmessage = function(event) {
        const data = JSON.parse(event.data);

        if (data.msg_type === 'authorize') {
          if (data.error) {
            log(`Auth Error: ${data.error.message}`);
            logout();
          } else {
            log(`Authenticated as: ${data.authorize.email}`);
            document.getElementById('tokenBtn').classList.add('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
            document.getElementById('accountContainer').classList.remove('hidden');
            document.getElementById('accountContainer').classList.add('flex');
            document.getElementById('accountEmail').innerText = data.authorize.email;
            document.getElementById('accountBalance').innerText = `Balance: $${data.authorize.balance}`;
          }
        }

        if (data.msg_type === 'tick') {
          const tick = data.tick;
          const quote = tick.quote.toFixed(tick.pip_size);
          const lastDigit = parseInt(quote.slice(-1));

          document.getElementById('livePriceDisplay').innerText = quote;
          updateRecentDigits(lastDigit);

          digitHistory.push(lastDigit);
          if (digitHistory.length > 1000) digitHistory.shift();

          updateStatsAndCheckStrategy();
        }

        if (data.msg_type === 'proposal') {
          if (data.error) {
            log(`Proposal Error: ${data.error.message}`);
            tradeInProgress = false;
          } else if (botActive) {
            ws.send(JSON.stringify({ buy: data.proposal.id, price: currentStake }));
            log(`Order placed for $${currentStake}...`);
          }
        }

        if (data.msg_type === 'buy') {
          if (data.error) {
            log(`Order Failed: ${data.error.message}`);
            tradeInProgress = false;
          } else {
            log(`Trade execution confirmed! Contract ID: ${data.buy.contract_id}`);
            setTimeout(() => { tradeInProgress = false; }, 3000);
          }
        }
      };

      ws.onclose = function() {
        log("Connection closed. Reconnecting in 3 seconds...");
        setTimeout(initWebSocket, 3000);
      };
    }

    function subscribeToMarket(market) {
      digitHistory = [];
      const marketNameMap = {
        'R_100': 'Volatility 100 Index',
        '1HZ100V': 'Volatility 100 (1s) Index',
        'R_75': 'Volatility 75 Index',
        'R_50': 'Volatility 50 Index',
        'R_25': 'Volatility 25 Index',
        'R_10': 'Volatility 10 Index',
        '1HZ200V': 'Volatility 200 (1s) Index',
        '1HZ300V': 'Volatility 300 (1s) Index'
      };
      document.getElementById('activeMarketDisplay').innerText = marketNameMap[market] || market;
      log(`Subscribing to live ticks for ${marketNameMap[market] || market}...`);
      
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ forget_all: "ticks" }));
        ws.send(JSON.stringify({ ticks: market }));
      }
    }

    function changeMarket(market) {
      currentMarket = market;
      subscribeToMarket(currentMarket);
    }

    function updateRecentDigits(digit) {
      const container = document.getElementById('recentDigitsContainer');
      const badge = document.createElement('span');
      badge.className = `px-1.5 py-0.5 rounded ${digit % 2 === 0 ? 'bg-blue-600/30 text-blue-400' : 'bg-amber-600/30 text-amber-400'}`;
      badge.innerText = digit;
      
      container.appendChild(badge);
      if (container.children.length > 8) {
        container.removeChild(container.firstChild);
      }
    }

    function renderDigitGrid() {
      const grid = document.getElementById('digitGrid');
      grid.innerHTML = '';
      for (let i = 0; i <= 9; i++) {
        grid.innerHTML += `
          <div class="flex flex-col items-center h-full justify-end">
            <span class="text-xs font-semibold text-slate-300 mb-1" id="pct-${i}">0.0%</span>
            <div class="w-full bg-slate-800 rounded-t-md overflow-hidden flex flex-col justify-end h-32">
              <div id="bar-${i}" class="bg-blue-500 w-full transition-all duration-300" style="height: 0%"></div>
            </div>
            <span class="text-xs font-bold text-slate-400 mt-2">${i}</span>
          </div>
        `;
      }
    }

    function updateStatsAndCheckStrategy() {
      const windowData = digitHistory.slice(-tickWindow);
      if (windowData.length === 0) return;

      const counts = Array(10).fill(0);
      windowData.forEach(d => counts[d]++);
      const pcts = counts.map(c => ((c / windowData.length) * 100));

      pcts.forEach((pct, digit) => {
        const bar = document.getElementById(`bar-${digit}`);
        const pctText = document.getElementById(`pct-${digit}`);
        if (bar && pctText) {
          bar.style.height = `${pct}%`;
          pctText.innerText = `${pct.toFixed(1)}%`;
          if (pct >= 12.0) bar.className = "bg-emerald-400 w-full transition-all duration-300";
          else if (pct <= 8.0) bar.className = "bg-rose-500 w-full transition-all duration-300";
          else bar.className = "bg-blue-500 w-full transition-all duration-300";
        }
      });

      if (botActive && !tradeInProgress) {
        if (!token) {
          log("Trading halted: Please enter an API Token to place automated trades.");
          toggleBot();
          return;
        }

        const targetDigit = parseInt(document.getElementById('targetDigit').value);
        const threshold = parseFloat(document.getElementById('triggerThreshold').value);
        const strategy = document.getElementById('strategyType').value;

        if (strategy === "OVER" || strategy === "UNDER") {
          const overPct = pcts.slice(targetDigit + 1).reduce((a, b) => a + b, 0);
          const underPct = pcts.slice(0, targetDigit).reduce((a, b) => a + b, 0);

          if (strategy === "OVER" && overPct >= threshold) {
            executeTrade(strategy, targetDigit);
          } else if (strategy === "UNDER" && underPct >= threshold) {
            executeTrade(strategy, targetDigit);
          }
        } else if (pcts[targetDigit] >= threshold) {
          executeTrade(strategy, targetDigit);
        }
      }
    }

    function executeTrade(strategy, digit) {
      tradeInProgress = true;
      const initialStake = parseFloat(document.getElementById('stakeAmount').value);
      if (!currentStake) currentStake = initialStake;

      log(`STRATEGY TRIGGER: ${strategy} signal detected with Barrier ${digit}. Executing contract...`);

      let contractType = "DIGITDIFF";
      if (strategy === "MATCHES") contractType = "DIGITMATCH";
      if (strategy === "OVER") contractType = "DIGITOVER";
      if (strategy === "UNDER") contractType = "DIGITUNDER";
      if (strategy === "EVEN") contractType = "DIGITEVEN";
      if (strategy === "ODD") contractType = "DIGITODD";

      const req = {
        proposal: 1,
        amount: currentStake,
        basis: "stake",
        contract_type: contractType,
        currency: "USD",
        duration: 1,
        duration_unit: "t",
        symbol: currentMarket
      };

      if (["DIGITDIFF", "DIGITMATCH", "DIGITOVER", "DIGITUNDER"].includes(contractType)) {
        req.barrier = digit.toString();
      }

      ws.send(JSON.stringify(req));
    }

    function promptManualToken() {
      const input = prompt("Enter your Deriv API Token (with Read & Trade permissions):");
      if (input && input.trim() !== "") {
        token = input.trim();
        localStorage.setItem('deriv_token', token);
        log("Authenticating with newly provided token...");
        ws.send(JSON.stringify({ authorize: token }));
      }
    }

    function logout() {
      localStorage.removeItem('deriv_token');
      location.reload();
    }

    function toggleBot() {
      botActive = !botActive;
      const btn = document.getElementById('toggleBotBtn');
      if (botActive) {
        btn.innerText = "Stop Auto Bot";
        btn.className = "w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-lg transition cursor-pointer";
        log("Automated execution engine STARTED.");
      } else {
        btn.innerText = "Start Auto Bot";
        btn.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition cursor-pointer";
        log("Automated execution engine STOPPED.");
      }
    }

    function changeTickWindow(val) {
      tickWindow = parseInt(val);
      updateStatsAndCheckStrategy();
    }
  </script>
</body>
</html>
