<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOET KENYA | Automated Deriv Suite</title>
  <!-- Tailwind CSS for modern dark HUD styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom Scrollbar for Terminal Logs */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

  <!-- TOP NAVIGATION HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div id="statusDot" class="w-3 h-3 rounded-full bg-rose-500"></div>
      <h1 class="text-xl font-bold tracking-wider text-emerald-400">SOET KENYA <span class="text-slate-400 text-sm font-normal">| Deriv Suite</span></h1>
    </div>
    
    <!-- OAUTH LOGIN / ACCOUNT STATUS -->
    <div id="authSection" class="flex items-center space-x-4">
      <span id="accountInfo" class="text-xs text-slate-400 hidden">Not Logged In</span>
      <button id="loginBtn" onclick="loginWithDeriv()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs py-2 px-4 rounded-lg transition cursor-pointer">
        Connect Deriv OAuth
      </button>
      <button id="logoutBtn" onclick="logout()" class="bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs py-2 px-4 rounded-lg transition hidden cursor-pointer">
        Disconnect
      </button>
    </div>
  </header>

  <!-- MAIN HUD CONTENT -->
  <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto w-full">

    <!-- LEFT & CENTER: DIGIT STATS ENGINE -->
    <div class="lg:col-span-2 flex flex-col gap-6">
      
      <!-- DIGIT PERCENTAGE VISUALIZER -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
        <div class="flex justify-between items-center mb-6">
          <div>
            <h2 class="text-lg font-semibold text-slate-200">Real-Time Digit Frequency</h2>
            <p class="text-xs text-slate-400">Live 0–9 statistical analysis on Volatility 100 Index</p>
          </div>
          <!-- TICK WINDOW SELECTOR -->
          <select id="tickWindow" onchange="changeTickWindow(this.value)" class="bg-slate-950 border border-slate-700 text-xs text-slate-300 rounded-lg px-3 py-2 outline-none">
            <option value="50">50 Ticks</option>
            <option value="100" selected>100 Ticks</option>
            <option value="500">500 Ticks</option>
            <option value="1000">1000 Ticks</option>
          </select>
        </div>

        <!-- 0-9 PERCENTAGE BARS -->
        <div id="digitGrid" class="grid grid-cols-10 gap-2 h-48 items-end border-b border-slate-800 pb-4">
          <!-- Dynamically populated by JS -->
        </div>
      </div>

      <!-- SYSTEM LOG TERMINAL -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex-1 flex flex-col">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Live System Log</h3>
        <div id="consoleLog" class="bg-slate-950 rounded-lg p-3 font-mono text-xs text-emerald-400 h-48 overflow-y-auto space-y-1">
          <div>[SYSTEM] Ready for OAuth Connection.</div>
        </div>
      </div>
    </div>

    <!-- RIGHT: STRATEGY & BOT ENGINE -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col justify-between">
      <div>
        <h2 class="text-lg font-semibold text-slate-200 mb-1">Bot Controls</h2>
        <p class="text-xs text-slate-400 mb-6">Synchronized automated trade triggers</p>

        <!-- STRATEGY SELECTOR -->
        <div class="space-y-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Active Strategy</label>
            <select id="strategyType" class="w-full bg-slate-950 border border-slate-700 text-sm text-slate-200 rounded-lg p-2.5 outline-none">
              <option value="DIFFERS">Match / Differs Strategy</option>
              <option value="EVEN_ODD">Even / Odd Strategy</option>
            </select>
          </div>

          <!-- TARGET DIGIT / THRESHOLD INPUTS -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Target Digit</label>
              <input type="number" id="targetDigit" value="7" min="0" max="9" class="w-full bg-slate-950 border border-slate-700 text-sm text-slate-200 rounded-lg p-2.5 outline-none">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Trigger Pct (%)</label>
              <input type="number" id="triggerThreshold" value="14" min="10" max="30" class="w-full bg-slate-950 border border-slate-700 text-sm text-slate-200 rounded-lg p-2.5 outline-none">
            </div>
          </div>

          <!-- RISK PARAMETERS -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Stake ($)</label>
              <input type="number" id="stakeAmount" value="1.0" step="0.5" class="w-full bg-slate-950 border border-slate-700 text-sm text-slate-200 rounded-lg p-2.5 outline-none">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Take Profit ($)</label>
              <input type="number" id="takeProfit" value="10.0" class="w-full bg-slate-950 border border-slate-700 text-sm text-slate-200 rounded-lg p-2.5 outline-none">
            </div>
          </div>
        </div>
      </div>

      <!-- BOT TOGGLE BUTTON -->
      <div class="mt-6 pt-6 border-t border-slate-800">
        <button id="toggleBotBtn" onclick="toggleBot()" disabled class="w-full bg-slate-800 text-slate-500 font-bold py-3 rounded-lg cursor-not-allowed transition">
          Start Auto Bot
        </button>
      </div>
    </div>

  </main>

  <!-- WEBSOCKET & OAUTH SCRIPT -->
  <script>
    // Configuration
    const APP_ID = "348Mnoh1ko1D10tYBCueg"; // Your exact registered Deriv App ID
    let ws;
    let token = null;
    let digitHistory = [];
    let tickWindow = 100;
    let botActive = false;
    let tradeInProgress = false;

    // Logging Utility
    function log(msg) {
      const consoleEl = document.getElementById('consoleLog');
      const time = new Date().toLocaleTimeString();
      consoleEl.innerHTML = `<div class="leading-relaxed"><span class="text-slate-500">[${time}]</span> ${msg}</div>` + consoleEl.innerHTML;
    }

    // Initialize Page & Handle OAuth Redirect Tokens
    window.addEventListener('DOMContentLoaded', () => {
      renderDigitGrid();
      
      // Parse token from URL parameters after OAuth redirect
      const urlParams = new URLSearchParams(window.location.search);
      const urlToken = urlParams.get('token1');
      const urlAccount = urlParams.get('acct1');

      if (urlToken) {
        token = urlToken;
        localStorage.setItem('deriv_token', token);
        if (urlAccount) localStorage.setItem('deriv_account', urlAccount);
        
        // Clean URL params without reloading page
        window.history.replaceState({}, document.title, window.location.pathname);
      } else {
        token = localStorage.getItem('deriv_token');
      }

      if (token) {
        connectWebSocket();
      } else {
        log("No active token found. Please click 'Connect Deriv OAuth'.");
      }
    });

// Redirect user to official Deriv OAuth page
    function loginWithDeriv() {
      // Force exact match with Deriv Portal URL including trailing slash
      let redirectUri = window.location.origin + window.location.pathname;
      if (!redirectUri.endsWith('/')) {
        redirectUri += '/';
      }
      
      // Standard Deriv OAuth link
      const oauthUrl = `https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}&l=EN`;
      window.location.href = oauthUrl;
    }
    
    function logout() {
      localStorage.removeItem('deriv_token');
      localStorage.removeItem('deriv_account');
      location.reload();
    }

    // Connect WebSocket and Authorize
    function connectWebSocket() {
      log("Connecting to Deriv WebSocket...");
      ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

      ws.onopen = function() {
        log("WebSocket connected. Authorizing session...");
        ws.send(JSON.stringify({ authorize: token }));
      };

      ws.onmessage = function(event) {
        const data = JSON.parse(event.data);

        if (data.msg_type === 'authorize') {
          if (data.error) {
            log(`Auth Error: ${data.error.message}`);
            logout();
          } else {
            log(`Authorized successfully! Account: ${data.authorize.email} (${data.authorize.loginid})`);
            
            // Update Top Header UI
            document.getElementById('statusDot').className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
            document.getElementById('loginBtn').classList.add('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
            document.getElementById('accountInfo').classList.remove('hidden');
            document.getElementById('accountInfo').innerText = `${data.authorize.email} | ${data.authorize.loginid}`;
            
            // Enable Bot Toggle Button
            const botBtn = document.getElementById('toggleBotBtn');
            botBtn.disabled = false;
            botBtn.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition cursor-pointer";

            // Subscribe to Live Ticks (Volatility 100 Index)
            ws.send(JSON.stringify({ ticks: "R_100" }));
          }
        }

        if (data.msg_type === 'tick') {
          const quote = data.tick.quote.toFixed(data.tick.pip_size);
          const lastDigit = parseInt(quote.slice(-1));
          
          digitHistory.push(lastDigit);
          if (digitHistory.length > 1000) digitHistory.shift();

          updateStatsAndEvaluate();
        }
      };

      ws.onerror = function(err) { log(`WS Error: Connection error.`); };
      ws.onclose = function() { log("WebSocket disconnected."); };
    }

    // Render 0-9 Digit Heatmap Bars
    function renderDigitGrid() {
      const grid = document.getElementById('digitGrid');
      grid.innerHTML = '';
      for (let i = 0; i <= 9; i++) {
        grid.innerHTML += `
          <div class="flex flex-col items-center h-full justify-end">
            <span class="text-xs font-semibold text-slate-300 mb-1" id="pct-${i}">0.0%</span>
            <div class="w-full bg-slate-800 rounded-t-md overflow-hidden flex flex-col justify-end h-32">
              <div id="bar-${i}" class="bg-blue-500 w-full transition-all duration-300" style="height: 0%"></div>
            </div>
            <span class="text-xs font-bold text-slate-400 mt-2">${i}</span>
          </div>
        `;
      }
    }

    // Update Percentage Stats on Every Tick
    function updateStatsAndEvaluate() {
      const windowData = digitHistory.slice(-tickWindow);
      if (windowData.length === 0) return;

      const counts = Array(10).fill(0);
      windowData.forEach(d => counts[d]++);

      const pcts = counts.map(c => ((c / windowData.length) * 100));

      // Update UI Bars
      pcts.forEach((pct, digit) => {
        const bar = document.getElementById(`bar-${digit}`);
        const pctText = document.getElementById(`pct-${digit}`);
        if (bar && pctText) {
          bar.style.height = `${pct}%`;
          pctText.innerText = `${pct.toFixed(1)}%`;

          // Dynamic Colors
          if (pct >= 12.0) bar.className = "bg-emerald-400 w-full transition-all duration-300";
          else if (pct <= 8.0) bar.className = "bg-rose-500 w-full transition-all duration-300";
          else bar.className = "bg-blue-500 w-full transition-all duration-300";
        }
      });

      // Evaluate Bot Signals
      if (botActive && !tradeInProgress) {
        const targetDigit = parseInt(document.getElementById('targetDigit').value);
        const threshold = parseFloat(document.getElementById('triggerThreshold').value);

        if (pcts[targetDigit] >= threshold) {
          executeTrade(targetDigit);
        }
      }
    }

    // Bot Signal Trigger Execution
    function executeTrade(digit) {
      tradeInProgress = true;
      const stake = parseFloat(document.getElementById('stakeAmount').value);
      log(`SIGNAL HIT! Digit ${digit} frequency reached threshold. Requesting contract proposal...`);

      // 1. Get Proposal
      ws.send(JSON.stringify({
        proposal: 1,
        amount: stake,
        basis: "stake",
        contract_type: "DIGITDIFF",
        currency: "USD",
        duration: 1,
        duration_unit: "t",
        symbol: "R_100",
        barrier: digit.toString()
      }));

      // Handler for proposal buy sequence
      const handleProposal = function(e) {
        const res = JSON.parse(e.data);
        if (res.msg_type === 'proposal') {
          ws.removeEventListener('message', handleProposal);
          if (res.error) {
            log(`Proposal Error: ${res.error.message}`);
            tradeInProgress = false;
          } else {
            // 2. Execute Buy
            ws.send(JSON.stringify({ buy: res.proposal.id, price: stake }));
            log(`Executing order for $${stake}...`);
            setTimeout(() => { tradeInProgress = false; }, 2500);
          }
        }
      };

      ws.addEventListener('message', handleProposal);
    }

    function toggleBot() {
      botActive = !botActive;
      const btn = document.getElementById('toggleBotBtn');
      if (botActive) {
        btn.innerText = "Stop Auto Bot";
        btn.className = "w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-lg transition cursor-pointer";
        log("Automated bot started.");
      } else {
        btn.innerText = "Start Auto Bot";
        btn.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition cursor-pointer";
        log("Automated bot stopped.");
      }
    }

    function changeTickWindow(val) {
      tickWindow = parseInt(val);
      updateStatsAndEvaluate();
    }
  </script>
</body>
</html>
